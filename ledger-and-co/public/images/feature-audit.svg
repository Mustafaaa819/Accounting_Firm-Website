<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER ART — stands in for a commissioned photograph. Ruled ledger
       paper: horizontal writing lines, a vertical money column, and a double
       rule under the total. -->
  <rect width="1200" height="900" fill="#12203A" />

  <g stroke="#F6F3EC" stroke-opacity="0.12" stroke-width="2">
    <path d="M0 120h1200M0 200h1200M0 280h1200M0 360h1200M0 440h1200M0 520h1200M0 600h1200M0 680h1200" />
  </g>

  <!-- Money columns -->
  <g stroke="#F6F3EC" stroke-opacity="0.2" stroke-width="2">
    <path d="M760 40v760M940 40v760" />
  </g>

  <!-- Entries: a few ruled figures blocked in as bars -->
  <g fill="#F6F3EC" fill-opacity="0.16">
    <rect x="120" y="146" width="380" height="14" />
    <rect x="120" y="226" width="300" height="14" />
    <rect x="120" y="306" width="420" height="14" />
    <rect x="120" y="386" width="260" height="14" />
    <rect x="120" y="466" width="350" height="14" />
    <rect x="800" y="146" width="100" height="14" />
    <rect x="820" y="226" width="80" height="14" />
    <rect x="790" y="306" width="110" height="14" />
    <rect x="830" y="386" width="70" height="14" />
    <rect x="810" y="466" width="90" height="14" />
  </g>

  <!-- The total, in amber, closed with the double rule -->
  <rect x="120" y="620" width="200" height="14" fill="#C4682B" fill-opacity="0.9" />
  <rect x="770" y="620" width="130" height="14" fill="#C4682B" fill-opacity="0.9" />
  <g fill="#C4682B">
    <rect x="760" y="656" width="150" height="3" />
    <rect x="760" y="666" width="150" height="3" />
  </g>
</svg>
