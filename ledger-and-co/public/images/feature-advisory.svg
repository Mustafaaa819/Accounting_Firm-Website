<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-hidden="true" preserveAspectRatio="xMidYMid slice">
  <!-- PLACEHOLDER ART — stands in for a commissioned photograph. The trial
       balance: two facing columns that have to come out level. -->
  <rect width="1200" height="900" fill="#EDE8DD" />

  <!-- The centre fold between the two sides -->
  <rect x="598" y="0" width="4" height="900" fill="#12203A" fill-opacity="0.15" />

  <g stroke="#12203A" stroke-opacity="0.1" stroke-width="2">
    <path d="M0 160h1200M0 250h1200M0 340h1200M0 430h1200M0 520h1200M0 610h1200" />
  </g>

  <!-- Debit side -->
  <g fill="#12203A" fill-opacity="0.22">
    <rect x="110" y="186" width="300" height="16" />
    <rect x="110" y="276" width="240" height="16" />
    <rect x="110" y="366" width="330" height="16" />
    <rect x="110" y="456" width="210" height="16" />
    <rect x="110" y="546" width="280" height="16" />
  </g>

  <!-- Credit side, deliberately offset down one line -->
  <g fill="#12203A" fill-opacity="0.22">
    <rect x="680" y="276" width="260" height="16" />
    <rect x="680" y="366" width="320" height="16" />
    <rect x="680" y="456" width="200" height="16" />
    <rect x="680" y="546" width="290" height="16" />
    <rect x="680" y="636" width="240" height="16" />
  </g>

  <!-- Both totals agree, marked with the double rule -->
  <g fill="#C4682B">
    <rect x="110" y="700" width="180" height="16" />
    <rect x="680" y="700" width="180" height="16" />
    <rect x="110" y="736" width="180" height="3" />
    <rect x="110" y="746" width="180" height="3" />
    <rect x="680" y="736" width="180" height="3" />
    <rect x="680" y="746" width="180" height="3" />
  </g>
</svg>
